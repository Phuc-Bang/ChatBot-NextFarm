  note: 'Sinh tu fact da duyet. Nguyen van: Nếu độ ẩm đất thấp hơn 70% cần tiến hành tưới cho dưa chuột
    để đảm bảo đất có độ ẩm 85-90%.'
- case_id: ka_011
