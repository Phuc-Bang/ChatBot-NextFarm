# Nhóm known_answer — câu hỏi có đáp án đã được người xác nhận
#
# SINH THẲNG TỪ BẢNG fact, KHÔNG VIẾT TAY
#
# Mỗi case ở đây tương ứng đúng một dòng `fact` có `verified = true`. Đáp án
# (`expected_facts`) ghép từ `value_min` / `value_max` / `unit` của chính dòng
# đó, và `source_of_truth` trỏ tới `document_id#sentence_index` — truy ngược
# được về một câu nguyên văn mà người duyệt đã đọc và xác nhận.
#
# VÌ SAO PHẢI SINH CHỨ KHÔNG VIẾT
#
# Nhóm known_answer của v1 viết tay, và 9/30 case chứa con số KHÔNG có trong
# văn bản gốc. Ví dụ ka_008 của v1 ghi "pH 5,5 - 6,5; EC 1,5 - 2,5 mS/cm"
# trong khi tài liệu nguồn không chứa một con số nào trong số đó.
#
# Thước đo có sẵn số bịa thì mọi phép đo "tỷ lệ bịa" đều vô nghĩa: hệ thống
# trả lời đúng theo tài liệu bị chấm là SAI, hệ thống bịa trúng đáp án bịa
# được chấm là ĐÚNG.
#
# Sinh từ bảng fact làm việc bịa trở thành bất khả: không có fact thì không
# có case. Muốn thêm case thì phải duyệt thêm số liệu.
#
# Câu hỏi lấy từ mẫu cố định trong evaluation/tools/sinh_v2.py — mẫu chỉ quy
# định CÁCH HỎI, không chứa một con số nào.

group: known_answer
version: v3
cases:
- case_id: ka_001
  question: khoảng cách trồng cà chua là bao nhiêu
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 60 - 80 cm
  source_of_truth: phanbonquocgia_ca_chua#46
  note: 'Sinh tu fact da duyet. Nguyen van: + Hàng cách hàng 80cm, cây cách cây 60cm, hoặc có thể là cây
    cách cây 40cm.'
- case_id: ka_002
  question: bón phân cho cà chua với lượng bao nhiêu
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 7 kg
  source_of_truth: ninhbinh_gntt_ca_chua#67
  note: 'Sinh tu fact da duyet. Nguyen van: - Bón thúc lần 4: (Sau lần thu hoạch trái đầu tiên): 7kg ure
    + 7kg kali+ 5kg NPK.'
- case_id: ka_003
  question: lượng phân bón cho cà chua là bao nhiêu, trước khi ra hoa
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 20 kg NPK/1000m2
  source_of_truth: phanbonquocgia_ca_chua#75
  must_have_caution: true
  note: 'Sinh tu fact da duyet. Nguyen van: Trước khi ra hoa: bón thúc 20 kg Better NPK 12-12-17-9+TE
    có thể bón rải quanh vùng rễ cây phát triển + phun bổ sung Better KNO3 liều lượng 200g/16 lít nước/1000
    m2 để kích thích r'
- case_id: ka_004
  question: bón phân cho cà chua với lượng bao nhiêu, sau khi ra hoa đến kết thúc thu hoạch
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 4 kg NPK/10 ngày
  source_of_truth: phanbonquocgia_ca_chua#76
  must_have_caution: true
  note: 'Sinh tu fact da duyet. Nguyen van: Sau khi cây ra hoa cho tới kết thúc giai đoạn thu hoạch tùy
    vào khả năng phát triển của cây có thể bón thúc 10 ngày/lần, liều lượng cho 1 lần bón: 4 kg Better
    NPK 12-12-17-9+TE pha'
- case_id: ka_005
  question: mật độ gieo trồng cà chua là bao nhiêu khi trồng nhà màng
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 3200 cây/1000m2
  source_of_truth: ca_chua__song_khoe_thu_kha_tien_nho#19
  note: 'Sinh tu fact da duyet. Nguyen van: Mật độ trồng hơn 3.200 cây/1.000m2 sàn nhà kính, khoảng cách
    của các bầu giá thể là 40cm.'
- case_id: ka_006
  question: nhiệt độ thích hợp cho cà chua là bao nhiêu khi ngâm ủ hạt giống
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 40 - 50 độ C
  source_of_truth: ninhbinh_gntt_ca_chua#33
  note: 'Sinh tu fact da duyet. Nguyen van: Trước khi gieo nên ngâm hạt trong nước có nhiệt độ 40-50 độ
    C trong khoảng 3 giờ, sau đó cho hạt vào túi vải bọc giấy.'
- case_id: ka_007
  question: đất trồng cà chua cần độ pH bao nhiêu khi chuẩn bị đất
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 6 - 6,5 pH
  source_of_truth: ninhbinh_gntt_ca_chua#15
  note: 'Sinh tu fact da duyet. Nguyen van: Độ ph trung bình của đất trồng cà chua khoảng 6-6.5, nếu đất
    chua hơn phải bón thêm vôi.'
- case_id: ka_008
  question: cà chua thích hợp với đất có pH khoảng bao nhiêu khi chuẩn bị đất
  crop: ca_chua
  expected_behavior: answer
  expected_facts: 6 - 6,5 pH
  source_of_truth: phanbonquocgia_ca_chua#19
  note: 'Sinh tu fact da duyet. Nguyen van: Đất có pH = 6.0-6.5, đất chua hơn phải bón thêm vôi.'
- case_id: ka_009
  question: độ ẩm đất cho dưa chuột nên duy trì bao nhiêu khi chăm sóc / tưới nước
  crop: dua_chuot
  expected_behavior: answer
