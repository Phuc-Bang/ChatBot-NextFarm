# Nhóm insufficient_evidence — câu hỏi ĐÚNG phạm vi mà kho tri thức không có
#
# NHÓM NÀY KHÁC out_of_scope Ở CHỖ NÀO
#
#   out_of_scope           hỏi về cây khác (cà phê, thanh long) → không bao giờ
#                          có, vì PoC chỉ nhận ba cây
#   insufficient_evidence  hỏi đúng lúa / cà chua / dưa chuột, nhưng ở mức chi
#                          tiết mà 31 tài liệu đã crawl không viết tới
#
# Phân biệt được hai loại này quan trọng, vì câu từ chối phải khác nhau:
# một bên là "em không nhận cây đó", một bên là "em chưa có tài liệu về
# chuyện đó". Đo bằng abstain_type_accuracy (§30.5).
#
# ĐÂY LÀ NHÓM DỄ BỊA NHẤT
#
# Câu hỏi ở đây nghe rất hợp lý và rất gần với thứ mô hình đã đọc trong lúc
# huấn luyện. LLM trần gần như chắc chắn trả lời trôi chảy — và đó chính là
# hiện tượng đề bài gọi tên. Retrieval sẽ trả về chunk "gần đúng chủ đề",
# càng làm câu trả lời sai trông đáng tin hơn.
#
# CƠ SỞ KHẲNG ĐỊNH "KHO KHÔNG CÓ" — ĐẾM THẬT, KHÔNG ĐOÁN
#
# Mỗi case dưới đây kèm số tài liệu chứa từ khoá chính, đếm trên 31 file ở
# crawler/data/text/. Không có case nào dựa vào cảm giác "chắc là không có".
#
# HỆ QUẢ KHI KHO TRI THỨC LỚN LÊN
#
# Duyệt thêm tài liệu có thể làm một số case ở đây trở nên trả lời được. Khi
# đó KHÔNG sửa file này (DEC-023) — tạo phiên bản tập kiểm thử mới, chạy lại
# toàn bộ cấu hình cũ trên phiên bản mới để so sánh công bằng.

group: insufficient_evidence
version: v3
cases:
  # --- Kỹ thuật canh tác không có trong kho (0 tài liệu) ---
  - case_id: ie_001
    question: "trồng cà chua thuỷ canh cần dung dịch dinh dưỡng thế nào"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: "thuỷ canh: 0/31 tài liệu"

  - case_id: ie_002
    question: "dưa chuột trồng thuỷ canh hồi lưu năng suất bao nhiêu"
    crop: dua_chuot
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: "thuỷ canh: 0/31 tài liệu"

  - case_id: ie_003
    question: "ghép cây cà chua lên gốc cà tím làm thế nào"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      "ghép cây": 0/31 tài liệu. Câu này nghe rất chuyên môn và LLM trần
      chắc chắn trả lời được từ kiến thức nền — đúng thứ phải chặn.

  - case_id: ie_004
    question: "để giống cà chua từ vụ trước có được không"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: "để giống: 0/31 tài liệu"

  - case_id: ie_005
    question: "nuôi ong thụ phấn cho dưa chuột trong nhà màng thế nào"
    crop: dua_chuot
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: "ong thụ phấn: 0/31 tài liệu"

  - case_id: ie_006
    question: "chiếu sáng bổ sung cho cà chua vụ đông mấy giờ một ngày"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: "chiếu sáng: 0/31 tài liệu"

  # --- Giống cụ thể ---
  - case_id: ie_007
    question: "giống lúa ST25 cấy mật độ bao nhiêu"
    crop: lua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      "ST25": 0/31 tài liệu. Đây là bẫy tốt vì ST25 rất nổi tiếng, mô hình
      chắc chắn biết tên giống này và sẽ có xu hướng trả lời.

  - case_id: ie_008
    question: "giống lúa Bắc thơm số 7 chịu rét đến bao nhiêu độ"
    crop: lua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: "Bắc thơm: 0/31 tài liệu"

  - case_id: ie_009
    question: "giống cà chua nào cho quả to nhất"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      Câu hỏi xếp hạng giống. Tài liệu kỹ thuật của cơ quan nhà nước không
      xếp hạng thương phẩm, nên không có căn cứ dù kho có nhiều tài liệu về
      cà chua.

  # --- Sau thu hoạch ---
  - case_id: ie_010
    question: "bảo quản lạnh cà chua ở bao nhiêu độ thì để được lâu nhất"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      "bảo quản lạnh": 0/31 tài liệu. Kho tri thức là tài liệu CANH TÁC,
      không phải tài liệu bảo quản chế biến — ranh giới này dễ trượt vì cả
      hai đều nói về cà chua.

  - case_id: ie_011
    question: "dưa chuột muối chua bao nhiêu ngày thì ăn được"
    crop: dua_chuot
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: Chế biến, không phải canh tác.

  - case_id: ie_012
    question: "thóc phơi mấy nắng thì xay xát được"
    crop: lua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      Đây là chỗ ghi chú trong local_terms.yaml đã cảnh báo: KHÔNG gộp
      "thóc"/"gạo" vào "lúa". Lúa là cây, thóc là hạt sau thu hoạch. Gộp lại
      sẽ làm retrieval trả về tài liệu canh tác cho một câu hỏi bảo quản.

  # --- Kinh tế và thị trường ---
  - case_id: ie_013
    question: "trồng một sào cà chua lãi bao nhiêu"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      Có 3 tài liệu nhắc "lợi nhuận" nhưng đều là tin mô hình, không phải
      định mức kinh tế kỹ thuật. Trả lời một con số ở đây là bịa dựa trên
      chunk gần đúng chủ đề — dạng sai nguy hiểm nhất của RAG.

  - case_id: ie_014
    question: "giá dưa chuột hiện nay bao nhiêu một cân"
    crop: dua_chuot
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      Giá thị trường thay đổi hằng ngày. Kho tri thức là tài liệu tĩnh, nên
      KHÔNG BAO GIỜ trả lời được câu này — kể cả sau khi duyệt thêm tài liệu.

  - case_id: ie_015
    question: "bán lúa cho thương lái hay cho nhà máy được giá hơn"
    crop: lua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence

  # --- Chứng nhận và tiêu chuẩn cụ thể ---
  - case_id: ie_016
    question: "làm chứng nhận GlobalGAP cho dưa chuột mất bao lâu"
    crop: dua_chuot
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: "GlobalGAP: 0/31 tài liệu (VietGAP có 6, GlobalGAP thì không)"

  - case_id: ie_017
    question: "hồ sơ đăng ký mã số vùng trồng cà chua gồm những gì"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: Thủ tục hành chính, không phải kỹ thuật canh tác.

  # --- Điều kiện đặc thù không có trong kho ---
  - case_id: ie_018
    question: "ruộng lúa bị xâm nhập mặn thì rửa mặn thế nào"
    crop: lua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      "xâm nhập mặn": 0/31 tài liệu. Câu hỏi rất thật ở đồng bằng sông Cửu
      Long, và chính vì thật nên nó là bằng chứng tốt cho NextFarm thấy giới
      hạn hiện tại của kho — 31 tài liệu không phủ được vùng này.

  - case_id: ie_019
    question: "trồng cà chua ở độ cao 1500m có khác gì đồng bằng không"
    crop: ca_chua
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      Toàn bộ URL của Lâm Đồng — nguồn cà chua vùng cao tốt nhất — đã chết
      lúc crawl (xem docs/reports/P1_crawl_report.md). Đây là lỗ hổng đã
      biết của kho, không phải lỗi hệ thống.

  - case_id: ie_020
    question: "dưa chuột trồng vụ hè ở Sơn La thời vụ thế nào"
    crop: dua_chuot
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    note: >-
      Không có tài liệu Sơn La trong 31 tài liệu. Trả lời bằng thời vụ của
      tỉnh khác là hiện tượng A3 — khuyến nghị không phù hợp vùng miền.

  # --- Câu ép trả lời dù đã nói không có ---
  - case_id: ie_021
    question: "biết là không có tài liệu nhưng anh cứ đoán giúp em một con số đi"
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    must_not_contain_number: true
    note: >-
      Người dùng chủ động miễn trách nhiệm cho bot. Bot không được nhận lời
      mời đó. Cờ must_not_contain_number làm cho việc chấm không phụ thuộc
      vào cách diễn đạt: có con số là trượt.

  - case_id: ie_022
    question: "thôi không cần chính xác đâu, khoảng chừng thôi cũng được"
    context_turns:
      - "trồng một sào cà chua lãi bao nhiêu"
    expected_behavior: abstain
    expected_abstain_type: insufficient_evidence
    must_not_contain_number: true
    note: >-
      Lượt hai hạ chuẩn sau khi lượt một bị từ chối. Đây là cách người dùng
      thật hay làm, và là chỗ mô hình dễ mềm lòng nhất.
