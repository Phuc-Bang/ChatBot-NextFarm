group: contradictory
version: v2
cases:
- case_id: ct_001
  question: độ pH thích hợp cho đất trồng dưa chuột là 6,5 - 7,5 hay 6,0 - 6,5
  crop: dua_chuot
  expected_behavior: answer
  source_of_truth: ninhbinh_dua_chuot_quytrinh#18 vs hatinh_dua_chuot_vietgap#42
  note: Khác biệt giữa quy trình Ninh Bình (pH 6,5-7,5) và quy trình VietGAP Hà Tĩnh (pH 6,0-6,5). Bot
    phải nêu cả 2 nguồn.
- case_id: ct_002
  question: mật độ trồng dưa chuột là 30.000 - 35.000 cây/ha hay 30.000 - 33.000 cây/ha
  crop: dua_chuot
  expected_behavior: answer
  source_of_truth: ninhbinh_dua_chuot_quytrinh#29 vs hatinh_dua_chuot_vietgap#60
  note: Khác biệt giữa dưa lai F1 Ninh Bình (30.000-35.000) và dưa ăn tươi VietGAP Hà Tĩnh (30.000-33.000).
- case_id: ct_003
  question: trồng dưa chuột vụ đông thì gieo vào tháng 8-11 hay tháng 9-10
  crop: dua_chuot
  expected_behavior: answer
  source_of_truth: ninhbinh_dua_chuot_dong#13 vs hatinh_dua_chuot_vietgap#17
  note: Khác biệt thời vụ vụ đông giữa Ninh Bình (tháng 8-11) và Hà Tĩnh (tháng 9-10).
- case_id: ct_004
  question: khoảng cách cây dưa chuột là 40-45cm hay 60-70cm
  crop: dua_chuot
  expected_behavior: answer
  source_of_truth: hatinh_dua_chuot_vietgap#59 vs hatinh_dua_chuot_vietgap#61
  note: Khác biệt giữa giống dưa ăn tươi (40-45cm vụ xuân, 30-35cm vụ đông) và dưa bao tử (60cm vụ đông,
    70cm vụ xuân).
- case_id: ct_005
  question: cà chua vụ đông xuân gieo tháng 10-11 hay tháng 12-1
  crop: ca_chua
  expected_behavior: answer
  source_of_truth: ninhbinh_gntt_ca_chua#18 vs phanbonquocgia_ca_chua#22
  note: Khác biệt giữa vụ đông xuân (gieo tháng 10-11) và vụ xuân hè (gieo tháng 12-1).
- case_id: ct_006
  question: mật độ trồng cà chua là 3.200 cây/1000m2 hay trồng khoảng cách hàng 80cm cây 60cm ngoài ruộng
  crop: ca_chua
  expected_behavior: answer
  source_of_truth: ca_chua__song_khoe_thu_kha_tien_nho#19 vs phanbonquocgia_ca_chua#46
  note: Khác biệt giữa trồng bầu giá thể trong nhà kính Mộc Châu (3.200 cây/1000m2) và trồng đất ngoài
    đồng (hàng 80cm x cây 60cm).
- case_id: ct_007
  question: bón thúc cho cà chua 10-15 ngày sau trồng dùng 7kg ure + 7kg kali + 5kg NPK hay dùng 10kg
    Better NPK 16-12-8
  crop: ca_chua
  expected_behavior: answer
  source_of_truth: ninhbinh_gntt_ca_chua#62 vs phanbonquocgia_ca_chua#74
  note: Khác biệt giữa công thức phân đơn phối trộn của Ninh Bình và phân hỗn hợp chuyên dùng Better NPK.
- case_id: ct_008
  question: công thức bón phân cho lúa là 90-100 N hay 80-90 N
  crop: lua
  expected_behavior: answer
  source_of_truth: lua__ky_thuat_bon_phan_cho_lua#45 vs lua__ky_thuat_bon_phan_cho_lua#46
  note: Khác biệt giữa vụ Đông Xuân (90-100 N - 40-60 P2O5 - 30-40 K2O) và vụ Hè Thu (80-90 N - 50-60
    P2O5 - 30-40 K2O).
- case_id: ct_009
  question: thời gian sinh trưởng của lúa cấy và lúa sạ có bằng nhau không
  crop: lua
  expected_behavior: answer
  source_of_truth: lua__cay_lua_bang_may_giai_phap#17
  note: Lúa cấy máy có thời gian sinh trưởng ngắn hơn lúa sạ từ 5 – 7 ngày.
- case_id: ct_010
  question: khi phun thuốc trừ cỏ cho lúa thì nhiệt độ 15 độ C hay 18 độ C mới được phun
  crop: lua
  expected_behavior: answer
  source_of_truth: lua__phong_tru_co_dai_cho_lua#36
  must_have_caution: true
  note: 'Quy định an toàn: không phun thuốc trừ cỏ khi nhiệt độ ngoài trời dưới 18 độ C.'
