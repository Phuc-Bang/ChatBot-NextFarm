# Docker Compose Production — Nextfarm AI Enterprise Suite
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nextfarm-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextfarm_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nextfarm}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextfarm} -d ${POSTGRES_DB:-nextfarm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nextfarm-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextfarm-prod-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-nextfarm}:${POSTGRES_PASSWORD:-nextfarm_secure_password}@db:5432/${POSTGRES_DB:-nextfarm}"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-nextfarm_admin_secret_token_change_in_prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_ENV: production
      EMBEDDING_MODEL: "bkai-foundation-models/vietnamese-bi-encoder"
    ports:
      - "${PORT:-8000}:8000"
    networks:
      - nextfarm-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  prod_pgdata:

networks:
  nextfarm-net:
    driver: bridge
