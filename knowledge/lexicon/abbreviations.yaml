# Từ điển viết tắt — LỚP 2 của xử lý tiếng Việt (quy chuẩn v2.0 §13.2)
#
# NGUYÊN TẮC:
#   - File này do NGƯỜI viết tay, đưa vào version control.
#   - TUYỆT ĐỐI KHÔNG để LLM tự sinh từ điển này rồi dùng luôn. Đó là đường
#     bịa đặt đi thẳng vào lớp hiểu câu hỏi.
#   - Chỉ dùng để chuẩn hoá HÌNH THỨC câu hỏi, không được suy diễn NỘI DUNG.
#
# CÁCH BỔ SUNG:
#   Mỗi lần chạy eval thấy một câu bị hiểu sai vì từ lạ → thêm vào đây →
#   chạy lại eval. Không thêm theo cảm tính.
#
# GIỚI HẠN HIỆN TẠI:
#   Danh sách này là viết tắt phổ thông trong tiếng Việt trên mạng, CHƯA
#   được đối chiếu với log hội thoại thật của NextFarm. Đây là mục số 7
#   trong danh sách "NextFarm cần chuẩn bị" (§37.6) — log hội thoại thật đã
#   ẩn danh là thứ có giá trị cao nhất để hoàn thiện file này.
#   Trạng thái: [ASM] — giả định của đội, chờ dữ liệu thật.

