# Cây trồng NGOÀI phạm vi PoC — dùng cho Scope Check (quy chuẩn v2.0 §12)
#
# VAI TRÒ CỦA FILE NÀY RẤT HẸP — ĐỌC KỸ TRƯỚC KHI SỬA
#
# File này KHÔNG quyết định câu hỏi có được trả lời hay không.
# Quyết định đó chỉ dựa vào một điều: có nhận ra cây TRONG phạm vi
# (lúa / cà chua / dưa chuột) hay không.
#
#     nhận ra cây trong phạm vi      → đi tiếp
#     không nhận ra cây trong phạm vi → KHÔNG trả lời, dù thế nào
#
# File này chỉ làm cho CÂU TỪ CHỐI cụ thể hơn: thay vì "em chưa rõ anh/chị
# hỏi cây gì", nói được "em chưa có tài liệu về cà phê".
#
# VÌ SAO PHẢI THIẾT KẾ NHƯ VẬY
#
# Danh sách cây trồng ở Việt Nam không bao giờ liệt kê hết được. Nếu quyết
# định "có trả lời không" phụ thuộc vào danh sách này, thì mỗi cây thiếu
# trong danh sách là một lỗ rò: bot gặp cây lạ, không thấy trong danh sách
# cấm, rồi trả lời bằng kiến thức nền của LLM — đúng thứ §12 cấm.
#
# Thiết kế hiện tại làm cho việc thiếu sót ở đây trở nên vô hại: thiếu một
# cây chỉ làm câu từ chối chung chung hơn, không làm lọt câu trả lời.
#
# Trạng thái: [ASM] — danh sách do người viết tay, chưa đối chiếu với log
# hội thoại thật của NextFarm.

