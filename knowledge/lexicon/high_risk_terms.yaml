# Từ khoá nội dung rủi ro cao — quy chuẩn v2.0 §19 case C4 và §24.4
#
# TÁC DỤNG (hai chỗ, đều là hàng rào an toàn, không phải bộ lọc nội dung):
#
#   1. Lúc chunking: chunk trúng từ khoá ở đây bị đánh cờ is_high_risk và
#      phải DUYỆT LẺ TỪNG CHUNK, không được duyệt gộp theo tài liệu (§24.4).
#   2. Lúc trả lời: câu trả lời trúng nhóm này bắt buộc phải qua Grounding
#      Validator tầng 2, và bắt buộc kèm cảnh báo. Thiếu evidence → abstain
#      tuyệt đối, không có ngoại lệ.
#
# NGUYÊN TẮC: thà đánh cờ thừa còn hơn bỏ sót. Đánh cờ thừa chỉ tốn thêm thời
# gian duyệt; bỏ sót thì bot có thể đưa liều lượng thuốc sai cho nông dân.
#
# File này KHÔNG chứa tên hoạt chất cụ thể hay liều lượng — chỉ chứa từ khoá
# nhận diện chủ đề. Mọi con số vẫn phải đến từ tài liệu đã crawl.

